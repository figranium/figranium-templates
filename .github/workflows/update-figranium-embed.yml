name: Update Figranium Embed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-figranium-embed.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Wait for @figranium/embed 0.1.1
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if npm view @figranium/embed@0.1.1 version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "@figranium/embed@0.1.1 was not published in time" >&2
          exit 1
      - name: Vendor Embed 0.1.1
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pushd "$tmp" >/dev/null
          npm pack @figranium/embed@0.1.1 --silent
          tar -xzf figranium-embed-0.1.1.tgz
          popd >/dev/null
          mkdir -p src/vendor/figranium-embed
          cp "$tmp/package/dist/index.js" src/vendor/figranium-embed/index.js
          cp "$tmp/package/dist/react.js" src/vendor/figranium-embed/react.js
          cp "$tmp/package/dist/style.css" src/vendor/figranium-embed/style.css
          rm -f .github/workflows/update-figranium-embed.yml
      - name: Commit vendored release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vendor/figranium-embed .github/workflows/update-figranium-embed.yml
          git commit -m "chore: update Figranium Embed to 0.1.1"
          git push
