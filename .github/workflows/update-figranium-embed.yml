name: Update Figranium Embed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-figranium-embed.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build Embed 0.1.1 from source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth=1 https://github.com/figranium/figranium-embed.git "$tmp/embed"
          test "$(node -p "require('$tmp/embed/package.json').version")" = "0.1.1"
          pushd "$tmp/embed" >/dev/null
          npm install
          npm run build
          popd >/dev/null
          mkdir -p src/vendor/figranium-embed
          cp "$tmp/embed/dist/index.js" src/vendor/figranium-embed/index.js
          cp "$tmp/embed/dist/react.js" src/vendor/figranium-embed/react.js
          cp "$tmp/embed/dist/style.css" src/vendor/figranium-embed/style.css
          rm -f .github/workflows/update-figranium-embed.yml
      - name: Commit vendored release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vendor/figranium-embed .github/workflows/update-figranium-embed.yml
          git commit -m "chore: update Figranium Embed to 0.1.1"
          git push
