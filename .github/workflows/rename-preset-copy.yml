name: Rename preset copy to template
on: push
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rename user-facing preset terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src')]
          exts = {'.ts', '.tsx', '.js', '.jsx', '.md', '.mdx', '.json', '.css'}
          # Deliberately leave implementation identifiers, DB/table names and /presets URLs alone.
          quoted = re.compile(r'(["\'`])([^"\'`]*?)\1')

          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in exts:
                      continue
                  text = path.read_text()
                  def repl(m):
                      q, s = m.group(1), m.group(2)
                      # Preserve URLs/routes exactly.
                      if '/presets' in s or s.startswith('presets/'):
                          return m.group(0)
                      s = re.sub(r'\bPresets\b', 'Templates', s)
                      s = re.sub(r'\bPreset\b', 'Template', s)
                      s = re.sub(r'\bpresets\b', 'templates', s)
                      s = re.sub(r'\bpreset\b', 'template', s)
                      return q + s + q
                  new = quoted.sub(repl, text)
                  # JSX text nodes are not quoted.
                  new = re.sub(r'(?<=>)([^<{]*?)\bPresets\b([^<{]*?)(?=<)', lambda m: m.group(1)+'Templates'+m.group(2), new)
                  new = re.sub(r'(?<=>)([^<{]*?)\bPreset\b([^<{]*?)(?=<)', lambda m: m.group(1)+'Template'+m.group(2), new)
                  new = re.sub(r'(?<=>)([^<{]*?)\bpresets\b([^<{]*?)(?=<)', lambda m: m.group(1)+'templates'+m.group(2), new)
                  new = re.sub(r'(?<=>)([^<{]*?)\bpreset\b([^<{]*?)(?=<)', lambda m: m.group(1)+'template'+m.group(2), new)
                  if new != text:
                      path.write_text(new)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Rename preset terminology to templates'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/rename-preset-copy.yml
          git commit -m 'Remove temporary terminology workflow'
          git push
