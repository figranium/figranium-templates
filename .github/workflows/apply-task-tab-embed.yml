name: Apply Task tab embed integration

on:
  push:
    branches: [task-tab-figranium-embed]
    paths:
      - .github/workflows/apply-task-tab-embed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: task-tab-figranium-embed
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update Task tab
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          page = Path('src/app/presets/[id]/page.tsx')
          text = page.read_text()

          if 'import TaskEmbed from "@/components/TaskEmbed";' not in text:
              text = text.replace(
                  'import Link from "next/link";\n',
                  'import Link from "next/link";\nimport TaskEmbed from "@/components/TaskEmbed";\n',
                  1,
              )

          text = text.replace(
              '    const requestedTab = (await searchParams)?.tab;\n    const activeTab = (["readme", "inputs", "steps", "output"].includes(requestedTab || "") ? requestedTab : "readme") as "readme" | "inputs" | "steps" | "output";',
              '    const requestedTab = (await searchParams)?.tab;\n    const normalizedTab = requestedTab === "steps" ? "task" : requestedTab;\n    const activeTab = (["readme", "task", "inputs", "output"].includes(normalizedTab || "") ? normalizedTab : "readme") as "readme" | "task" | "inputs" | "output";',
              1,
          )

          text = text.replace(
              '                        { id: "readme", label: "README", icon: "menu_book" },\n                        { id: "inputs", label: "Inputs", icon: "data_object" },\n                        { id: "steps", label: "Steps", icon: "account_tree" },\n                        { id: "output", label: "Expected Output", icon: "output" },',
              '                        { id: "readme", label: "README", icon: "menu_book" },\n                        { id: "task", label: "Task", icon: "account_tree" },\n                        { id: "inputs", label: "Inputs", icon: "data_object" },\n                        { id: "output", label: "Expected Output", icon: "output" },',
              1,
          )

          old_start = '                        {activeTab === "steps" && (<>'
          if old_start in text:
              start = text.index(old_start)
              end = text.index('                        {activeTab === "output" && (', start)
              text = text[:start] + '                        {activeTab === "task" && (\n                            <TaskEmbed task={config} />\n                        )}\n\n' + text[end:]

          text = text.replace('{/* Main Content: Description & Steps */}', '{/* Main Content */}', 1)
          page.write_text(text)

          component = Path('src/components/TaskEmbed.tsx')
          component_text = component.read_text().replace(
              'from "@figranium/embed";',
              'from "@/vendor/figranium-embed/index.js";',
          )
          component.write_text(component_text)

          package_path = Path('package.json')
          package_json = json.loads(package_path.read_text())
          package_json['dependencies'].pop('@figranium/embed', None)
          package_path.write_text(json.dumps(package_json, indent=2) + '\n')
          PY
      - name: Build Figranium Embed
        run: |
          git clone --depth 1 https://github.com/figranium/figranium-embed.git /tmp/figranium-embed
          cd /tmp/figranium-embed
          npm install
          npm run build
      - name: Vendor Embed build
        run: |
          rm -rf src/vendor/figranium-embed
          mkdir -p src/vendor/figranium-embed
          cp -R /tmp/figranium-embed/dist/. src/vendor/figranium-embed/
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-task-tab-embed.yml
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/presets/[id]/page.tsx src/components/TaskEmbed.tsx src/vendor/figranium-embed package.json .github/workflows/apply-task-tab-embed.yml
          git commit -m "Replace Steps tab with Figranium Embed"
          git push origin task-tab-figranium-embed
