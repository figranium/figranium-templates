name: Audit templates refactor

on:
  push:
    branches:
      - rename-presets-tabler-icons

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-presets-tabler-icons

      - name: Fix known detail-page leftover
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/presets/[id]/page.tsx')
          text = path.read_text().replace(') : template.icon ? (', ') : preset.icon ? (')
          path.write_text(text)

      - name: Audit remaining legacy terms
        run: |
          echo '--- Remaining Material references ---'
          grep -RniE 'MaterialIcon|material-symbols|Material Symbols' src README.md || true
          echo '--- Remaining preset references ---'
          grep -RniE '\bpreset(s)?\b' src README.md || true

      - name: Commit fix and self-delete
        run: |
          rm .github/workflows/audit-template-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix final template detail reference"
          git push origin HEAD:rename-presets-tabler-icons
