name: Refresh Embed after canvas bounds fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-embed-after-canvas-bounds.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build latest Figranium Embed
        run: |
          git clone --depth=1 https://github.com/figranium/figranium-embed.git /tmp/figranium-embed
          cd /tmp/figranium-embed
          npm install
          npm run build
      - name: Refresh vendored Embed
        run: |
          rm -rf src/vendor/figranium-embed
          mkdir -p src/vendor/figranium-embed
          cp /tmp/figranium-embed/dist/index.js src/vendor/figranium-embed/index.js
          cp /tmp/figranium-embed/dist/react.js src/vendor/figranium-embed/react.js
          cp /tmp/figranium-embed/dist/style.css src/vendor/figranium-embed/style.css
      - name: Remove temporary workflow
        run: rm .github/workflows/refresh-embed-after-canvas-bounds.yml
      - name: Commit refreshed bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vendor/figranium-embed .github/workflows/refresh-embed-after-canvas-bounds.yml
          git commit -m "Refresh Embed with sticky note bounds fix"
          git push origin main
